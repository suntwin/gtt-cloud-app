<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="860" height="560" fill="#ffffff"/>
  <text x="30" y="40" font-size="22" font-weight="700" fill="#111">Semi-western forehand grip (right-hander)</text>
  <text x="30" y="64" font-size="14" fill="#555">Base knuckle of the index finger on bevel 4 · heel of the hand on bevel 4 too · loose grip, trigger finger</text>

  <!-- End view of the handle -->
  <text x="190" y="104" font-size="15" font-weight="700" fill="#111" text-anchor="middle">1. Look at the butt cap</text>
  <text x="190" y="122" font-size="12.5" fill="#555" text-anchor="middle">racquet edge pointing up, strings facing left/right</text>
  <g transform="translate(190,300)">
    <polygon points="-58,-140 58,-140 140,-58 140,58 58,140 -58,140 -140,58 -140,-58" fill="#f3f4f6" stroke="#374151" stroke-width="2.5"/>
    <!-- bevel numbers: 1 top, clockwise -->
    <text x="0" y="-150" font-size="16" font-weight="700" text-anchor="middle" fill="#374151">1</text>
    <text x="112" y="-108" font-size="16" font-weight="700" text-anchor="middle" fill="#374151">2</text>
    <text x="158" y="6" font-size="16" font-weight="700" text-anchor="middle" fill="#374151">3</text>
    <text x="114" y="124" font-size="16" font-weight="700" text-anchor="middle" fill="#15803d">4</text>
    <text x="0" y="166" font-size="16" font-weight="700" text-anchor="middle" fill="#9ca3af">5</text>
    <text x="-114" y="124" font-size="16" font-weight="700" text-anchor="middle" fill="#374151">6</text>
    <text x="-158" y="6" font-size="16" font-weight="700" text-anchor="middle" fill="#374151">7</text>
    <text x="-112" y="-108" font-size="16" font-weight="700" text-anchor="middle" fill="#374151">8</text>
    <!-- highlighted bevel 4 -->
    <line x1="140" y1="58" x2="58" y2="140" stroke="#16a34a" stroke-width="9" stroke-linecap="round"/>
    <circle cx="99" cy="99" r="13" fill="#16a34a"/>
    <!-- current western on 5 -->
    <line x1="58" y1="140" x2="-58" y2="140" stroke="#9ca3af" stroke-width="6" stroke-dasharray="8 6"/>
    <circle cx="0" cy="140" r="10" fill="none" stroke="#9ca3af" stroke-width="3"/>
    <!-- racquet edge indicator -->
    <text x="0" y="-60" font-size="12.5" text-anchor="middle" fill="#6b7280">top edge of the frame</text>
    <line x1="0" y1="-48" x2="0" y2="-20" stroke="#6b7280" stroke-width="1.5"/>
  </g>
  <g font-size="13">
    <circle cx="48" cy="490" r="8" fill="#16a34a"/>
    <text x="64" y="495" fill="#111"><tspan font-weight="700">Bevel 4 = semi-western</tspan> (move here)</text>
    <circle cx="48" cy="518" r="7" fill="none" stroke="#9ca3af" stroke-width="3"/>
    <text x="64" y="523" fill="#555">Bevel 5 = Western (where the floor pick-up puts you)</text>
  </g>

  <!-- Side view of the hand -->
  <text x="610" y="104" font-size="15" font-weight="700" fill="#111" text-anchor="middle">2. Finger placement</text>
  <text x="610" y="122" font-size="12.5" fill="#555" text-anchor="middle">palm view, butt cap on the left</text>
  <g transform="translate(400,160)">
    <!-- handle -->
    <rect x="20" y="120" width="380" height="56" rx="10" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
    <rect x="6" y="114" width="22" height="68" rx="6" fill="#9ca3af"/>
    <text x="340" y="153" font-size="12" fill="#6b7280">→ to the head</text>
    <!-- heel of hand -->
    <ellipse cx="62" cy="148" rx="36" ry="44" fill="#fde7d4" stroke="#b45309" stroke-width="2"/>
    <text x="62" y="214" font-size="12" text-anchor="middle" fill="#92400e">heel pad near the butt cap</text>
    <!-- pinky, ring, middle bunched -->
    <rect x="96" y="96" width="30" height="104" rx="15" fill="#fde7d4" stroke="#b45309" stroke-width="2"/>
    <rect x="128" y="92" width="32" height="112" rx="16" fill="#fde7d4" stroke="#b45309" stroke-width="2"/>
    <rect x="162" y="90" width="34" height="116" rx="17" fill="#fde7d4" stroke="#b45309" stroke-width="2"/>
    <!-- gap then index (trigger) angled up the handle -->
    <g transform="rotate(-14 236 148)">
      <rect x="220" y="86" width="34" height="122" rx="17" fill="#fde7d4" stroke="#b45309" stroke-width="2.5"/>
    </g>
    <line x1="198" y1="60" x2="214" y2="60" stroke="#16a34a" stroke-width="2"/>
    <text x="206" y="50" font-size="12" text-anchor="middle" fill="#15803d">small gap</text>
    <text x="268" y="70" font-size="12.5" font-weight="700" fill="#15803d">index = "trigger finger"</text>
    <text x="268" y="86" font-size="12" fill="#555">spread up the handle</text>
    <!-- thumb -->
    <rect x="252" y="176" width="64" height="26" rx="13" fill="#fde7d4" stroke="#b45309" stroke-width="2"/>
    <text x="320" y="222" font-size="12" text-anchor="middle" fill="#92400e">thumb wraps around, touching the middle finger</text>
  </g>

  <!-- Checklist -->
  <g font-size="13.5" fill="#111">
    <text x="440" y="430" font-weight="700">How to find it</text>
    <text x="440" y="454">• Start from your floor pick-up (Western, bevel 5)</text>
    <text x="440" y="476">• Slide your hand one bevel up towards the top edge,</text>
    <text x="452" y="496">so the index knuckle moves from bevel 5 to bevel 4</text>
    <text x="440" y="518">• Spread the index finger like a trigger, grip at 3/10</text>
    <text x="440" y="540">• Swing low to high, contact in front at waist height</text>
  </g>
</svg>
